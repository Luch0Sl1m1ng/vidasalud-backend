# EP5 - Cluster Kafka: ZooKeeper + 3 brokers + Kafka UI.
# (Guia 3.2.1 usaba 1 broker; ahora son 3 para poder usar replication factor 3 y min.insync.replicas 2.)
# Pensado para la EC2 independiente de mensajeria (la misma de RabbitMQ).
#
# Uso:   cd kafka && docker compose up -d        (Kafka UI en http://<ip-publica>:8080)
#
# KAFKA_ADVERTISED_HOST = direccion con la que los clientes (appointments / notify / streams / kafka-admin)
# llegan a los brokers desde FUERA de Docker:
#   - en tu maquina:  localhost      (valor por defecto)
#   - en la EC2:      IP PRIVADA de la EC2 de mensajeria (ej. KAFKA_ADVERTISED_HOST=172.31.23.197)
# Los clientes usan  KAFKA_BOOTSTRAP_SERVERS=<host>:9092,<host>:9093,<host>:9094
# Auto-creacion de topics desactivada: los topics los crean los microservicios o kafka-admin.
# Memoria limitada por broker (KAFKA_HEAP_OPTS) para que entren 3 en una EC2 pequena.
x-kafka-broker: &kafka-broker
  image: confluentinc/cp-kafka:7.5.0
  depends_on:
    - zookeeper
  restart: unless-stopped

x-kafka-common-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DELETE_TOPIC_ENABLE: "true"
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"

services:
  # ZooKeeper: coordinador del cluster (metadatos y eleccion de lider)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka-1:
    <<: *kafka-broker
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9092

  kafka-2:
    <<: *kafka-broker
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9093

  kafka-3:
    <<: *kafka-broker
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9094

  # Kafka UI: topics, particiones, mensajes, offsets y consumer groups
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vidasalud
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped
