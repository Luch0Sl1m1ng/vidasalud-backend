# Guia 3.2.1 - Apache Kafka con Docker: ZooKeeper + Kafka Broker + Kafka UI.
# Pensado para la EC2 independiente de mensajeria (la misma de RabbitMQ).
#
# Uso:   cd kafka && docker compose up -d        (Kafka UI en http://<ip-publica>:8080)
#
# KAFKA_ADVERTISED_HOST es la direccion con la que los clientes (appointments / notify)
# se conectan al broker desde FUERA de Docker:
#   - en tu maquina (como en la guia): localhost       (valor por defecto)
#   - en la EC2:                       IP PRIVADA de la EC2 de mensajeria  (ej. KAFKA_ADVERTISED_HOST=172.31.23.197)
# La creacion automatica de topics esta desactivada (como en la guia): el topic
# "vidasalud.citas" lo crea ms-vidasalud-appointments al arrancar, o a mano (ver README).
services:
  # ZooKeeper: Coordinador del cluster Kafka (gestiona los metadatos)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  # Kafka Broker: el servidor de mensajeria
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Conexiones internas (entre contenedores) y externas (appointments / notify / tu PC)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    restart: unless-stopped

  # Kafka UI: interfaz grafica para ver topics, particiones, mensajes y offsets
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped
