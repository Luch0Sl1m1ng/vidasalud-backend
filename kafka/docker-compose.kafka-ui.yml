# Kafka UI independiente: para conectarla a un cluster que ya corre (otra EC2, tu PC, etc.).
# Uso:  KAFKA_BOOTSTRAP=172.31.23.197:9092,172.31.23.197:9093,172.31.23.197:9094 \
#       docker compose -f docker-compose.kafka-ui.yml up -d      -> http://localhost:8080
services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vidasalud
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP:?define KAFKA_BOOTSTRAP}
    restart: unless-stopped
