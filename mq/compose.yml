# Clúster RabbitMQ de 2 nodos (equivalente a "ec2-mq" del caso).
# Uso (en la EC2 independiente de RabbitMQ):  cd mq && docker compose up -d
#   Nodo 1: AMQP <ip>:5672  | UI http://<ip>:15672   <- los microservicios se conectan aqui
#   Nodo 2: AMQP <ip>:5673  | UI http://<ip>:15673
# Si lo pruebas en tu PC junto al compose principal, cambia estos puertos para no chocar con 5672/15672.
# Credenciales: variables RABBITMQ_USER / RABBITMQ_PASSWORD / RABBITMQ_ERLANG_COOKIE (archivo mq/.env)
services:
  rabbitmq-1:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks: [rabbitmq_cluster]

  rabbitmq-2:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE}   # MISMA cookie que el nodo 1
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks: [rabbitmq_cluster]
    depends_on:
      - rabbitmq-1

volumes:
  rabbitmq_data_1:
  rabbitmq_data_2:

networks:
  rabbitmq_cluster:
    driver: bridge
